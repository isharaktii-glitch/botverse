<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotVerse - AI Auto Reply Bot</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <div class="logo-section">
    <div id="bot3d-container"></div>
    <h1 class="brand-title">BotVerse</h1>
    <p class="tagline">ඔයාගේ WhatsApp, Facebook, Instagram වලට AI Auto Reply</p>
  </div>

  <div class="auth-box" id="authBox">
    
    <div class="tabs">
      <button class="tab-btn active" id="loginTab" onclick="showLogin()">Login</button>
      <button class="tab-btn" id="registerTab" onclick="showRegister()">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="auth-form">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit" class="btn-primary">Login</button>
      <p class="error-msg" id="loginError"></p>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="auth-form hidden">
      <input type="text" id="regUsername" placeholder="Username" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPassword" placeholder="Password" required>
      <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
      <button type="submit" class="btn-primary">Register</button>
      <p class="error-msg" id="registerError"></p>
    </form>

  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<!-- Three.js for 3D bot -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/bot-3d.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
